<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>About Me</title>
  <style>
    .software-container {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      margin-top: 10px;
    }
    .software-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 80px;
    }
    .software-item img {
      width: 48px;
      height: 48px;
    }
    .software-item span {
      margin-top: 5px;
      text-align: center;
      font-size: 14px;
    }
  </style>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header>
    <nav>
      <h1>Emile L. About Me</h1>
      <ul>
        <li><a href="index.html" class="juicy-hover ripple-button press-button">Accueil</a></li>
        <li><a href="projects.html" class="juicy-hover ripple-button press-button">Projets</a></li>
        <li><a href="cv.html" class="juicy-hover ripple-button press-button">CV</a></li>
        <li><a href="contact.html" class="juicy-hover ripple-button press-button">Contact</a></li>
        <li>
          <div class="language-toggle juicy-hover">
            <button id="lang-fr" class="lang-btn">FR</button>
            <button id="lang-en" class="lang-btn">EN</button>
          </div>
        </li>
      </ul>
    </nav>
  </header>
  
  <main>
    <section id="about-section"></section>
  </main>

  <footer>
    <p>Contact : emile@example.com — 06 xx xx xx xx</p>
    <p>
      <a href="https://linkedin.com/in/tonprofil">LinkedIn</a> |
      <a href="https://emilezola.itch.io/">itch.io</a> |
      <a href="mailto:emile@example.com">Email</a>
    </p>
  </footer>

  <script>
    document.querySelectorAll('.ripple-button').forEach(button => {
      button.addEventListener('click', function (e) {
        const ripple = document.createElement('span');
        ripple.classList.add('ripple');
  
        const rect = button.getBoundingClientRect();
        const size = Math.max(rect.width, rect.height);
        ripple.style.width = ripple.style.height = `${size}px`;
        ripple.style.left = `${e.clientX - rect.left - size / 2}px`;
        ripple.style.top = `${e.clientY - rect.top - size / 2}px`;
  
        this.appendChild(ripple);
        setTimeout(() => ripple.remove(), 600);
      });
    });
  </script>

  <script>
      let currentLang = localStorage.getItem("lang") || "fr";
      const langButtons = document.querySelectorAll(".lang-btn");

      function updateLangUI() {
        langButtons.forEach(btn => {
          btn.classList.remove("active");
          const isActive = (btn.id === "lang-fr" && currentLang === "fr") ||
                          (btn.id === "lang-en" && currentLang === "en");
          if (isActive) btn.classList.add("active");
        });
      }

      function switchLanguage(lang) {
        currentLang = lang;
        localStorage.setItem("lang", lang);
        if (typeof renderProjects === "function") {
          renderProjects(); // will load new language + update project list
        }
        updateLangUI();
      }

      langButtons.forEach(btn => {
        btn.addEventListener("click", () => {
          const lang = btn.id === "lang-fr" ? "fr" : "en";
          switchLanguage(lang);
        });
      });

      // On initial load
      switchLanguage(currentLang);

      // Reload page
      document.querySelectorAll(".lang-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          currentLang = btn.id === "lang-fr" ? "fr" : "en";
          localStorage.setItem("lang", currentLang);
          location.reload(); // This reloads the page
        });
      });
    </script>

    <script>
    async function loadAboutMe() {
      let currentLang = localStorage.getItem("lang") || "fr";

      try {
        const res = await fetch(`lang/${currentLang}.json`);
        if (!res.ok) throw new Error("Erreur de chargement");
        const data = await res.json();

        const about = data.AboutMe;
        const section = document.getElementById("about-section");

        // Titre
        const h2 = document.createElement("h2");
        h2.textContent = about.Title;
        section.appendChild(h2);

        // Paragraphes et Skills
        about.Paragraphs.forEach((para, idx) => {
          const p = document.createElement("p");
          p.innerHTML = para;
          section.appendChild(p);

          if (idx === 1) { // Après "Les skills que j'ai pu développer..."
            const ul = document.createElement("ul");
            about.Skills.forEach(skill => {
              const li = document.createElement("li");
              li.innerHTML = skill;
              ul.appendChild(li);
            });
            section.appendChild(ul);
          }
        });

        // Logiciels
        const softwareContainer = document.createElement("div");
        softwareContainer.className = "software-container";
        about.Software.forEach(soft => {
          const div = document.createElement("div");
          div.className = "software-item";
          div.innerHTML = `
            <img src="${soft.icon}" alt="${soft.name}">
            <span>${soft.name}</span>
          `;
          softwareContainer.appendChild(div);
        });
        section.appendChild(softwareContainer);

      } catch (err) {
        console.error("Erreur chargement AboutMe:", err);
      }
    }

    loadAboutMe();
    </script>

</body>
</html>
