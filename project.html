<body>
  <!-- Navigation using button IDs to change their text according to their languages -->
  <nav>
    <h1 id="nav-name">Emile</h1>
    <h1 id="nav-currentPage"></h1>
    <ul>
      <li><a id="nav-home" href="index.html" class="juicy-hover ripple-button press-button">Accueil</a></li>
      <li><a id="nav-about" href="about.html" class="juicy-hover ripple-button press-button">À propos</a></li>
      <li><a id="nav-projects" href="projects.html" class="juicy-hover ripple-button press-button">Tous les projets</a></li>
      <li><a id="nav-cv" href="cv.html" class="juicy-hover ripple-button press-button">CV</a></li>
      <li>
        <div class="language-toggle juicy-hover">
            <button id="lang-fr" class="lang-btn">FR</button>
            <button id="lang-en" class="lang-btn">EN</button>
          </div>
      </li>
    </ul>
  </nav>

  <main>
    <div id="project-container" class="project-page"></div>
  </main>

  <script type="module" src="js/project.js"></script>

  <!-- Sticky Nav -->
  <script>
      let lastScrollTop = 0;
      const nav = document.querySelector("nav");
      
      window.addEventListener("scroll", () => {
        const scrollTop = window.scrollY || document.documentElement.scrollTop;
        
        if (scrollTop > lastScrollTop) {
          // Scroll vers le bas -> cache le nav
          nav.classList.add("nav-hidden");
        } else {
          // Scroll vers le haut -> montre le nav
          nav.classList.remove("nav-hidden");
        }
        
        // Ajoute ou retire flou + ombre selon la position
        if (scrollTop > 10) {
          nav.classList.add("nav-scrolled");
        } else {
          nav.classList.remove("nav-scrolled");
        }
        
        lastScrollTop = scrollTop <= 0 ? 0 : scrollTop;
      });

   </script>

  <!-- Ripple Effect -->
  <script>
    document.querySelectorAll('.ripple-button').forEach(button => {
      button.addEventListener('click', function (e) {
        const ripple = document.createElement('span');
        ripple.classList.add('ripple');
  
        const rect = button.getBoundingClientRect();
        const size = Math.max(rect.width, rect.height);
        ripple.style.width = ripple.style.height = `${size}px`;
        ripple.style.left = `${e.clientX - rect.left - size / 2}px`;
        ripple.style.top = `${e.clientY - rect.top - size / 2}px`;
  
        this.appendChild(ripple);
        setTimeout(() => ripple.remove(), 600);
      });
    });
  </script>

  <!-- Current Language -->
  <script>
      let currentLang = localStorage.getItem("lang") || "fr";
      const langButtons = document.querySelectorAll(".lang-btn");

      function updateLangUI() {
        langButtons.forEach(btn => {
          btn.classList.remove("active");
          const isActive = (btn.id === "lang-fr" && currentLang === "fr") ||
                          (btn.id === "lang-en" && currentLang === "en");
          if (isActive) btn.classList.add("active");
        });
      }

      function switchLanguage(lang) {
        currentLang = lang;
        localStorage.setItem("lang", lang);
        if (typeof renderProjects === "function") {
          renderProjects(); // will load new language + update project list
        }
        updateLangUI();
      }

      langButtons.forEach(btn => {
        btn.addEventListener("click", () => {
          const lang = btn.id === "lang-fr" ? "fr" : "en";
          switchLanguage(lang);
        });
      });

      // On initial load
      switchLanguage(currentLang);

      document.querySelectorAll(".lang-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          currentLang = btn.id === "lang-fr" ? "fr" : "en";
          localStorage.setItem("lang", currentLang);
          location.reload(); // This reloads the page
        });
      });
      
    </script>

    <!-- Button like Home, About, Projects, etc. And change their languages -->
    <script>
    async function loadNav() {
      const currentLang = localStorage.getItem("lang") || "fr";
      try {
        const res = await fetch(`lang/${currentLang}.json`);
        if (!res.ok) throw new Error(`Erreur chargement traduction: ${res.status}`);
        const translations = await res.json();

        // Mise à jour des éléments de navigation
        document.getElementById("nav-currentPage").innerHTML = `${translations.nav.projects}`;
        document.getElementById("nav-name").textContent = translations.nav.name;
        document.getElementById("nav-home").textContent = translations.nav.HomePage;
        document.getElementById("nav-about").textContent = translations.nav.about;
        document.getElementById("nav-projects").textContent = translations.nav.projects;
        document.getElementById("nav-cv").textContent = translations.nav.cv;

      } catch (err) {
        console.error("Erreur chargement nav:", err);
      }
    }

    loadNav();
    </script>

</body>
